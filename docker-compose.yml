version: '3.8'

## Backend
services:
  backend:
    container_name: backend-dev
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - db

##Frontend
  frontend:
    container_name: frontend-dev
    image: node:20-alpine
    working_dir: /app
    env_file: .env
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

## BD
  db:
    container_name: postgres-db
    image: postgres:15-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
